function icon(n,size=20){return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n]||ICONS.spark}"/></svg>`;}
function go(id,label,style='primary',ic=''){return `<button class="btn ${style}" data-go="${id}">${esc(label)}${ic?icon(ic,18):''}</button>`;}
function act(action,label,style='primary',value=''){return `<button class="btn ${style}" data-action="${action}" data-value="${esc(value)}">${esc(label)}</button>`;}
function chip(label,goId='',active=false){return `<button class="chip ${active?'selected':''}" ${goId?`data-go="${goId}"`:'data-action="chip"'}>${esc(label)}</button>`;}
function tag(label,cls=''){return `<span class="tag ${cls}">${esc(label)}</span>`;}
function intro(kicker,title,desc=''){return `<div class="intro">${kicker?`<div class="eyebrow">${esc(kicker)}</div>`:''}<h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>`;}
function note(s,ic='info'){return `<div class="notice">${icon(ic,16)}<span>${s}</span></div>`;}
function section(title,link='',id=''){return `<div class="section-head"><h2>${title}</h2>${link?`<button class="text-button" data-go="${id}">${link}${icon('chevron',14)}</button>`:''}</div>`;}
function card(html,cls=''){return `<div class="card ${cls}">${html}</div>`;}
function menu(rows){return `<div class="menu">${rows.map(([title,sub,id,ic='chevron',tail=''])=>`<button class="menu-row" data-go="${id}"><span class="menu-icon">${icon(ic,19)}</span><span class="row-copy"><strong>${title}</strong>${sub?`<small>${sub}</small>`:''}</span>${tail?tag(tail):icon('chevron',16)}</button>`).join('')}</div>`;}
function field(label,placeholder,value='',type='text',name=''){return `<label class="field-label">${label}<input type="${type}" placeholder="${esc(placeholder)}" value="${esc(value)}" ${name?`data-field="${name}"`:''} autocomplete="off"></label>`;}
function textarea(label,placeholder,value='',name=''){return `<label class="field-label">${label}<textarea rows="4" maxlength="${name==='reply'?50:200}" placeholder="${esc(placeholder)}" ${name?`data-field="${name}"`:''}>${esc(value)}</textarea></label>`;}
function toggle(title,sub='',on=true){return `<label class="switch-row"><span><strong>${title}</strong>${sub?`<small>${sub}</small>`:''}</span><input type="checkbox" ${on?'checked':''}><span class="switch"></span></label>`;}

v('H16',intro('MEET PING','좋은 마음이<br>다음 대화가 되는 곳.','친구에게 긍정적인 질문을 보내고,<br>나에게 온 마음을 확인하는 학교 관계 앱이에요.')+`<div class="stack">${card(`${tag('질문으로 떠올려요')}<h3 style="margin-top:10px">함께 있으면 웃게 되는 친구는?</h3><p>질문을 읽고 떠오르는 친구를 고르면,<br>그 친구에게 익명의 Ping이 도착해요.</p>`)}${card(`${tag('마음을 확인해요')}<h3 style="margin-top:10px">친구가 나를 떠올렸다는 소식</h3><p>25명부터 내가 어떤 질문에 선택됐는지 볼 수 있어요. 보낸 사람의 신원은 공개하지 않아요.</p>`)}${card(`${tag('40명부터 주고받아요')}<h3 style="margin-top:10px">한 번의 반응, 또 하나의 질문</h3><p>무료 원터치 반응과 짧은 답장,<br>다른 질문으로 마음을 돌려주는 역질문이 열려요.</p>`)}</div>`+note('이 화면은 이용 방법 안내예요. 질문 선택이나 가상 체험은 제공하지 않아요.'),go('H17','친구 초대 방법 알아보기')+go('A18','초대 링크·QR 보기','secondary'));
v('H17',intro('INVITE, THEN CONNECT','아직 가입하지 않은<br>친구도 함께 시작해요.','친구의 이름을 대신 고르는 방식이 아니라,<br>친구가 직접 초대 링크나 QR로 들어와요.')+`<div class="stack">${card(`${tag('01 · 초대 보내기')}<h3 style="margin-top:10px">링크를 붙여넣거나 QR 보여주기</h3><p>초대 화면에서 링크를 복사해 메신저에 보내거나,<br>옆에 있는 친구에게 QR을 보여줘요.</p>`)}${card(`${tag('02 · 친구가 직접 가입')}<h3 style="margin-top:10px">초대받은 학교를 확인하고 시작</h3><p>친구가 링크를 열거나 QR을 스캔하면<br>학교 정보가 담긴 가입 화면으로 연결돼요.</p>`)}${card(`${tag('03 · 우리 학교가 한 단계 더')}<h3 style="margin-top:10px">15명부터 첫 질문이 열려요</h3><p>25명에는 학교 질문과 내 결과,<br>40명에는 전체 서비스가 열려요.</p>`)}</div>`+note('초대만 보냈을 때는 인원이 늘지 않아요. 친구가 가입한 뒤 학교 인원에 반영돼요.'),go('A18','초대 링크·QR 열기')+go('H11','단계별 이용 범위 보기','text'));
v('H18',intro('SCHOOL IS OPEN','우리 학교 투표가<br>열렸어요!','친구들과 시작할 준비가 됐는지 확인할게요.')+stageCard(40)+menu([['첫 질문에 참여하기','친구 조건도 충족했어요','Q01','spark'],['연결 친구가 부족해요','남은 조건 확인하기','H14','users']]),go('Q01','첫 질문으로 이동'));

const DEMO_QUESTIONS=[['친구와 우정','함께 있으면<br>괜히 웃게 되는 친구는?'],['시험 기간','어려운 문제를<br>같이 풀어보고 싶은 친구는?'],['처음 만나는 취향','플레이리스트를<br>같이 만들고 싶은 친구는?'],['병점고 로컬','우리 학교 축제에서<br>같이 부스를 맡고 싶은 친구는?'],['작은 배려','새로운 친구에게<br>먼저 말을 걸어주는 친구는?'],['체육대회','같은 팀이 되면<br>서로 응원해줄 친구는?'],['쉬는 시간','재밌는 책이나 영화를<br>소개해주고 싶은 친구는?'],['학교생활','모둠 활동에서<br>아이디어를 잘 들어주는 친구는?'],['새로운 경험','새로운 동아리에<br>같이 도전해보고 싶은 친구는?'],['오늘의 고마움','오늘 고맙다는 마음을<br>전하고 싶은 친구는?']];
function question(type='normal'){const local=type==='local'||type==='stage25',fresh=type==='fresh',newf=type==='friend',limited=type==='stage15'||type==='stage25';const max=limited?2:10;const step=limited?Math.min(STATE.limitedStep||1,2):Math.min(STATE.step||1,10);const sample=DEMO_QUESTIONS[step-1];const title=local?(step===2?'우리 반에 새로 온 친구를<br>잘 챙겨줄 친구는?':'우리 학교 축제에서<br>같이 부스를 맡고 싶은 친구는?'):fresh?'플레이리스트를<br>같이 만들고 싶은 친구는?':newf?'새 학기에 더<br>친해지고 싶은 친구는?':sample[1];
 return {body:`<div class="question-meta"><span>${step} / ${max} 문항</span>${tag(type==='stage25'?'2단계 · 병점고 로컬':local?'병점고 로컬':fresh?'처음 만나는 테마':newf?'새 친구와 첫 질문':limited?'1단계 · 첫 질문':sample[0])}</div>${progress(step,max)}<h2 class="question-title">${title}</h2>${candidates('Q03',newf)}<div class="question-bottom">${act('shuffle','후보 섞기','text')}${go('Q07','건너뛰기','text')}</div>${limited?note(type==='stage25'?'학교 로컬 질문에 참여하고 받은 Ping을 확인할 수 있어요. 반응·답장·역질문·채팅과 10문항 세트는 40명부터 열려요.':'15~24명은 실제 질문 2개에 참여해요. 결과 확인은 25명, 일반 10문항 세트는 40명부터 열려요.'):newf?note('새 친구를 고르지 않아도 괜찮아요. 누구를 선택했는지는 공개하지 않아요.'):''}`,actions:act('vote','친구를 선택해 주세요','primary',limited?'2':'10'),question:true};}

 if(name==='setFeaturedBadge'){const badge=BADGES.find(b=>b.id===el.dataset.value&&b.earned);if(!badge){toast('받은 배지 중에서 대표 배지를 고를 수 있어요.');return;}STATE.featuredBadge=badge.id;navigate('M01');toast('내 프로필의 대표 배지를 바꿨어요. 친구 공개 여부는 별도 설정이에요.');return;}
 if(name==='saveBadges'){STATE.publicBadges=[...root.querySelectorAll('[data-badge-public]:checked')].map(input=>input.dataset.badgePublic).filter(id=>BADGES.some(b=>b.id===id&&b.earned));navigate('M08');toast('배지 공개 선택을 이 시연에 저장했어요. 실제 사용자에게 공개하지 않아요.');return;}
 if(name==='inquiry'){if(getField(root,'inquiry').length<5){toast('문의 내용을 5자 이상 적어 주세요.');return;}navigate('B06');return;}
 if(name==='deleteAccount'){if(!root.querySelector('.switch-row input:checked')){toast('삭제 안내 확인을 선택해 주세요.');return;}navigate('B14');return;}
 if(name==='suggestionScope'){STATE.suggestionText=getField(root,'suggestion');STATE.suggestionScope=el.dataset.value==='global'?'global':'school';render();return;}
 if(name==='suggestion'){if(getField(root,'suggestion').length<8){toast('질문을 8자 이상으로 구체적으로 적어 주세요.');return;}STATE.suggestionText=getField(root,'suggestion');navigate('O02');return;}
 if(name==='adminSave'){toast('운영 규칙을 확인한 시연입니다. 실제 추천 모델이나 공급은 변경하지 않아요.');return;}
 if(name==='removePhoto'){STATE.photo=null;navigate('M01');return;}
 if(name==='unfriend'){navigate('F05');toast('시안의 친구 관계를 해제한 상태예요.');return;}
 if(name==='rejectRequest'){el.closest('.person-row').remove();toast('친구 요청을 거절한 상태예요.');return;}
 throw Error('Unimplemented action '+name);
}
document.addEventListener('click',e=>{
 const theme=e.target.closest('[data-theme]');if(theme){STATE.theme=theme.dataset.theme;render();return;}
 const view=e.target.closest('[data-view]');if(view){STATE.view=view.dataset.view;render();return;}
 const target=e.target.closest('[data-go]');
 if(target){const device=target.closest('.phone');if(device){STATE.schoolCount=Number(device.dataset.schoolCount);navigate(target.dataset.go);}else previewScreen(target.dataset.go);return;}
 const el=e.target.closest('[data-action]');if(el)action(el.dataset.action,el).catch(err=>{console.error(err);toast('시안 동작에 오류가 생겼어요. 화면을 다시 선택해 주세요.');});
});
document.addEventListener('change',e=>{if(e.target.matches('[data-photo]')){const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('이미지를 선택해 주세요.');return;}if(file.size>8*1024*1024){toast('8MB 이하 이미지를 선택해 주세요.');return;}const reader=new FileReader();reader.onload=()=>{STATE.photo=reader.result;navigate('M01');};reader.readAsDataURL(file);return;}if(e.target.closest('.switch-row')?.textContent.includes('다크 모드')){STATE.theme=e.target.checked?'dark':'light';render();}});
$('#search').addEventListener('input',renderCatalog);

window.PING={SCREENS,GROUPS,VIEWS,BY_ID,STATE,BADGES,phone,navigate,previewScreen,resolveSchoolDestination,schoolNav,render};
const missing=SCREENS.filter(s=>!VIEWS[s.id]);if(missing.length)throw Error('Missing screen layouts: '+missing.map(s=>s.id).join(','));
const initial=new URLSearchParams(location.hash.slice(1));
if(BY_ID[initial.get('screen')])STATE.screen=initial.get('screen');
if(['prototype','gallery'].includes(initial.get('view')))STATE.view=initial.get('view');
if(['light','dark','both'].includes(initial.get('theme')))STATE.theme=initial.get('theme');
STATE.schoolCount=SCHOOL_SCREEN_CONTEXT[STATE.screen]??40;
new ResizeObserver(entries=>{document.documentElement.style.setProperty('--studio-header-height',Math.ceil(entries[0].target.getBoundingClientRect().height)+'px');}).observe(document.querySelector('.studio-header'));
render();
</script></body></html>
